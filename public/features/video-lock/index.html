<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Замок на відео</title>
<style>
  :root {
    --bg: #0b0c0e;
    --card: #131519;
    --line: rgba(255, 255, 255, 0.09);
    --line-soft: rgba(255, 255, 255, 0.05);
    --text: #edeef0;
    --muted: #8b8f96;
    --accent: #6ee7a8;
    --accent-ink: #06130c;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 40px 24px 64px;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .lede { color: var(--muted); font-size: 14px; margin-top: 6px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 28px;
  }

  .item {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }

  /* ── Превʼю ─────────────────────────────────────────────── */

  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #1c2430, #0a0d11);
  }

  /* Замість реального відео — градієнт, що повільно рухається.
     Файл не має тягнути мегабайти, щоб залишитись самодостатнім. */
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.07) 50%, transparent 65%);
    background-size: 260% 100%;
    animation: sweep 4.5s linear infinite;
  }

  @keyframes sweep { to { background-position: -260% 0; } }

  .item.locked .thumb { cursor: pointer; }

  /* Затемнення поверх замкненого превʼю */
  .item.locked .thumb::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: rgba(6, 8, 10, 0.62);
    backdrop-filter: blur(3px);
  }

  .badge {
    position: absolute;
    z-index: 2;
    top: 10px;
    right: 10px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(6, 8, 10, 0.72);
    border: 1px solid var(--line-soft);
    color: var(--muted);
  }

  .lock {
    position: relative;
    z-index: 2;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--accent);
    background: rgba(6, 8, 10, 0.66);
    border: 1px solid var(--line);
    transition: transform 0.3s var(--ease), background-color 0.3s var(--ease), color 0.3s var(--ease);
  }

  .item.locked:hover .lock {
    transform: scale(1.08);
    background: var(--accent);
    color: var(--accent-ink);
  }

  .hint {
    position: absolute;
    z-index: 2;
    left: 10px;
    bottom: 10px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(6, 8, 10, 0.72);
    border: 1px solid var(--line-soft);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
  }

  .item.locked:hover .hint { opacity: 1; transform: none; }

  /* Відкритий урок: замок і затемнення зникають, лишається кнопка відтворення */
  .item:not(.locked) .lock,
  .item:not(.locked) .hint { display: none; }

  .play {
    position: relative;
    z-index: 2;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: none;
    place-items: center;
    color: var(--accent-ink);
    background: var(--accent);
  }

  .item:not(.locked) .play { display: grid; }

  /* ── Підпис ─────────────────────────────────────────────── */

  .info { padding: 12px 14px 14px; border-top: 1px solid var(--line-soft); }
  .info b { display: block; font-size: 14px; font-weight: 600; }
  .info span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* ── Банер доступу ──────────────────────────────────────── */

  .banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 22px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
  }

  .banner p { font-size: 14px; color: var(--muted); max-width: 46ch; }
  .banner strong { color: var(--text); font-weight: 600; }

  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: opacity 0.3s var(--ease);
  }

  button:hover { opacity: 0.86; }

  button.ghost {
    background: transparent;
    border-color: var(--line);
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .thumb::after { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Урок 3. Техніка присіду</h1>
  <p class="lede">Структуру видно всім. Самі відео відкриваються після оплати.</p>

  <div class="grid" id="grid"></div>

  <div class="banner">
    <p id="bannerText">
      <strong>3 з 4 відео замкнені.</strong>
      Відкрий доступ, щоб дивитись розбори повністю.
    </p>
    <button id="unlock" type="button">Відкрити доступ</button>
  </div>
</div>

<script>
  var LESSONS = [
    { title: 'Розминка', meta: 'Підготовка суглобів', dur: '4:12', free: true },
    { title: 'Постановка стоп', meta: 'База', dur: '6:40', free: false },
    { title: 'Глибина присіду', meta: 'Техніка', dur: '8:05', free: false },
    { title: 'Типові помилки', meta: 'Розбір', dur: '5:28', free: false }
  ];

  var LOCK_ICON =
    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
    '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  var PLAY_ICON =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
    '<path d="M8 5v14l11-7z"/></svg>';

  var grid = document.getElementById('grid');

  grid.innerHTML = LESSONS.map(function (lesson) {
    var locked = lesson.free ? '' : ' locked';
    var label = lesson.free
      ? 'Урок відкритий: ' + lesson.title
      : 'Відкрийте доступ, щоб переглянути відео';

    return '' +
      '<article class="item' + locked + '">' +
        '<div class="thumb" title="' + label + '">' +
          '<span class="badge">' + lesson.dur + '</span>' +
          '<div class="lock">' + LOCK_ICON + '</div>' +
          '<div class="play">' + PLAY_ICON + '</div>' +
          '<span class="hint">Відкрити доступ</span>' +
        '</div>' +
        '<div class="info"><b>' + lesson.title + '</b><span>' + lesson.meta + '</span></div>' +
      '</article>';
  }).join('');

  var button = document.getElementById('unlock');
  var bannerText = document.getElementById('bannerText');

  function setUnlocked(unlocked) {
    var items = grid.querySelectorAll('.item');
    items.forEach(function (item, i) {
      item.classList.toggle('locked', !unlocked && !LESSONS[i].free);
    });

    button.textContent = unlocked ? 'Замкнути назад' : 'Відкрити доступ';
    button.classList.toggle('ghost', unlocked);
    bannerText.innerHTML = unlocked
      ? '<strong>Доступ відкрито.</strong> Усі 4 відео доступні.'
      : '<strong>3 з 4 відео замкнені.</strong> Відкрий доступ, щоб дивитись розбори повністю.';
  }

  var unlocked = false;

  button.addEventListener('click', function () {
    unlocked = !unlocked;
    setUnlocked(unlocked);
  });

  // Клік по замкненому превʼю веде туди ж, куди й кнопка — до пропозиції купити.
  grid.addEventListener('click', function (event) {
    if (event.target.closest('.item.locked')) {
      document.querySelector('.banner').scrollIntoView({ block: 'center' });
      button.focus();
    }
  });
</script>
</body>
</html>
